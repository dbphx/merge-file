services:
  postgres:
    image: postgres:16-alpine
    container_name: merge-pdf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mergepdf}
      POSTGRES_USER: ${POSTGRES_USER:-mergepdf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mergepdf}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./scripts/seed_users.sql:/docker-entrypoint-initdb.d/002_seed_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mergepdf} -d ${POSTGRES_DB:-mergepdf}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - merge-pdf-net

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: merge-pdf-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - merge-pdf-net

  redis:
    image: redis:7-alpine
    container_name: merge-pdf-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - merge-pdf-net

  backend:
    build:
      context: ./backend
    container_name: merge-pdf-backend
    restart: unless-stopped
    environment:
      BACKEND_PORT: 8080
      BACKEND_PUBLIC_URL: ${APP_URL}
      ALLOWED_ORIGIN: ${APP_URL}
      DATABASE_URL: postgres://${POSTGRES_USER:-mergepdf}:${POSTGRES_PASSWORD:-mergepdf}@postgres:5432/${POSTGRES_DB:-mergepdf}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_DRIVE_API_KEY: ${GOOGLE_DRIVE_API_KEY:-}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10G}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-300}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-merged-pdfs}
      MINIO_USE_SSL: "false"
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    expose:
      - "8080"
    networks:
      - merge-pdf-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: merge-pdf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - merge-pdf-net

  nginx:
    image: nginx:1.27-alpine
    container_name: merge-pdf-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - merge-pdf-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: merge-pdf-cloudflared
    restart: unless-stopped
    user: root
    command: tunnel --config /etc/cloudflared/config.yml run
    depends_on:
      - nginx
    volumes:
      - ${CLOUDFLARED_DIR:-/root/.cloudflared}:/etc/cloudflared:ro
    networks:
      - merge-pdf-net

networks:
  merge-pdf-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:
