services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mergepdf}
      POSTGRES_USER: ${POSTGRES_USER:-mergepdf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mergepdf}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./scripts/seed_users.sql:/docker-entrypoint-initdb.d/002_seed_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mergepdf} -d ${POSTGRES_DB:-mergepdf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      BACKEND_PORT: 8080
      BACKEND_PUBLIC_URL: ${APP_URL}
      ALLOWED_ORIGIN: ${APP_URL}
      DATABASE_URL: postgres://${POSTGRES_USER:-mergepdf}:${POSTGRES_PASSWORD:-mergepdf}@postgres:5432/${POSTGRES_DB:-mergepdf}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_DRIVE_API_KEY: ${GOOGLE_DRIVE_API_KEY:-}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10G}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-300}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-merged-pdfs}
      MINIO_USE_SSL: "false"
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

  cloudflared:
    image: cloudflare/cloudflared:2025.5.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

volumes:
  postgres_data:
  minio_data:
